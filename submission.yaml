submission:
  title: "CrisisAI: Emergency Incident Prioritization & Deduplication Dashboard"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    During natural disasters and municipal emergencies, relief authorities receive thousands of fragmented,
    unstructured text reports across social media, SMS, and hotlines. Manually reading, filtering, and cross-referencing
    redundant messages delays life-saving rescue responses and causes severe cognitive overload for emergency dispatchers.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    CrisisAI is an intelligent emergency operations platform that automates report ingestion, extracts structured
    incident telemetry using NLP (IBM watsonx.ai Granite), deduplicates corroborating reports using N-gram text
    embeddings and cosine similarity clustering, ranks incidents by human life risk, and visualizes live actionable
    intelligence on an interactive command center dashboard.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Multi-channel unstructured text ingestion with NLP information extraction (type, location, urgency, people affected)"
    - "Dual-engine intelligence: IBM watsonx.ai Granite 3.0 foundation models with resilient local NLP fallback"
    - "Text embedding similarity clustering that eliminates duplicate tickets and synthesizes corroborating AI evidence"
    - "Dynamic multi-factor priority scoring algorithm ranking emergencies by human life threat and crowd corroboration"
    - "Tactical Disaster Geo-Grid Map with real-time severity pins, pulse radar alerts, and recommended emergency response actions"                              # e.g., "Real-time pipeline anomaly detection using watsonx.ai"


  tech_stack:
    languages: [Python, JavaScript]                      
    frameworks: [FastAPI, React, Vite]                    
    ibm_technologies: [watsonx.ai, Granite 3.0, IBM Bob]              
    databases: [SQLite, SQLAlchemy]                     
    other: [scikit-learn, TF-IDF, Cosine Similarity, Pydantic, Uvicorn, pytest, Git, GitHub]                         

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    We are most proud of our end-to-end AI pipeline that transforms 50 raw and unstructured emergency reports into 18 unique, actionable incidents.
    The system combines NLP-based information extraction, similarity-based deduplication, corroborating evidence synthesis, and multi-factor priority
    scoring to help emergency responders identify which incidents require immediate attention. We are also proud of integrating IBM watsonx.ai 
    Granite with a local NLP fallback, making the system both intelligent and resilient during demonstrations or when cloud AI services are unavailable.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    The current prototype primarily uses curated and synthetic emergency reports rather than a live production emergency data stream. 
    The local NLP fallback provides reliable demonstration capabilities but does not have the full language understanding of a foundation model. 
    SQLite is used for the prototype and would need to be replaced with a production-grade database for large-scale concurrent deployments. 
    Location detection currently uses configured coordinates rather than a complete geocoding service. Similarity and priority thresholds would 
    require additional validation using larger real-world emergency datasets. AI-generated classifications and recommendations should also be 
    reviewed by trained emergency personnel before being used in real emergency operations.

